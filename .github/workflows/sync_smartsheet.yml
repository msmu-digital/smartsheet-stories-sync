name: Sync Smartsheet Stories to JSON

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

jobs:
  sync-data:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Execute Extraction Script
        env:
          SMARTSHEET_ACCESS_TOKEN: ${{ secrets.SMARTSHEET_ACCESS_TOKEN }}
          SMARTSHEET_SHEET_ID: ${{ secrets.SMARTSHEET_SHEET_ID }}
        run: python normalize-data.py

      - name: Commit and Push Updated stories.json
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "auto: update stories.json [skip ci]"
          file_pattern: "stories.json"

      
      - name: Deploy stories.json to SiteGround via SFTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.4
        with:
          server: ${{ secrets.CASCADE_SERVER_HOST }}
          username: ${{ secrets.CASCADE_SERVER_USER }}
          key-content: ${{ secrets.CASCADE_SSH_PRIVATE_KEY }}
          port: 18765
          local-dir: "./"
          server-dir: "/home/customer/msmary.edu/public_html/assets/data/"
          exclude: |
            **/*
            !stories.json
