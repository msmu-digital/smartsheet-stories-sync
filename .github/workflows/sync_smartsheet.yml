name: Sync Smartsheet Stories to JSON

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

jobs:
  sync-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Execute Extraction Script
        env:
          SMARTSHEET_ACCESS_TOKEN: ${{ secrets.SMARTSHEET_ACCESS_TOKEN }}
          SMARTSHEET_SHEET_ID: ${{ secrets.SMARTSHEET_SHEET_ID }}
        run: python normalize_data.py

      - name: Commit and Push Updated stories.json
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "auto: update stories.json [skip ci]"
          file_pattern: "stories.json"

      - name: Install SSH Key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.CASCADE_SSH_PRIVATE_KEY }}

      - name: Add SiteGround to Known Hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -p 18765 -H ${{ secrets.CASCADE_SERVER_HOST }} >> ~/.ssh/known_hosts

      - name: Deploy stories.json to SiteGround via SFTP
        run: |
          rsync -avz -e "ssh -p 18765" stories.json ${{ secrets.CASCADE_SERVER_USER }}@${{ secrets.CASCADE_SERVER_HOST }}://home/customer/msmary.edu/public_html/assets/data/stories.json
